[project]
name = "spikecut"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.3",
    "alembic>=1.20.0",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "prometheus-client>=0.26.0",
    "pydantic>=2",
    "pydantic-settings>=2.15.0",
    "redis[hiredis]>=5.3.1",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.4.11",
    "streamlink>=8.6.1",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.53.0",
    "websockets>=17.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "testcontainers>=4.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spikecut"]
